name: Build (warnings as errors)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-warnaserror:
    name: Build (warnings as errors)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BackPocketEmulator.slnx

    - name: Build with warnings as errors
      run: dotnet build BackPocketEmulator.slnx --no-restore --configuration Release -warnaserror
