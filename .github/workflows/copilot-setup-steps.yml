name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  workflow_call:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BackPocketBasic.slnx

      - name: Build solution
        run: dotnet build BackPocketBasic.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BackPocketBasic.slnx --configuration Release --no-build --verbosity minimal

      - name: Verify emudbg batch boot (simple profile)
        run: |
          dotnet run --project src/BadMango.Emulator.Debug --configuration Release --no-build -- \
            --profile simple-65c02 \
            --headless \
            --no-banner \
            --exec "regs;step 5;regs;exit"